<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turfbooked</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F5EF;--cd:#fff;--bd:#DDE4DA;--tx:#0B0F0C;--mu:#55625A;--ac:#C8FF2E;--at:#3B6B00;--on:#0B0F0C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0F0C;--cd:#151C17;--bd:#232C26;--tx:#F4F7F2;--mu:#9AA79F;--at:#C8FF2E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F0C;--cd:#151C17;--bd:#232C26;--tx:#F4F7F2;--mu:#9AA79F;--at:#C8FF2E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 'DM Sans',system-ui,sans-serif}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px 20px 24px}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2{margin:0}
h2{font-size:17px;margin:22px 0 10px}
.d{font-family:Unbounded,system-ui,sans-serif;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.dash{border-style:dashed}
.b{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-weight:700}
.ol{background:none;border:1px solid var(--at);color:var(--at)}
.w{width:100%;min-height:52px}
.ib{width:44px;height:44px;flex:none;border-radius:50%;background:var(--cd);border:1px solid var(--bd);display:grid;place-items:center}
.pill{display:inline-block;border:1px solid var(--at);color:var(--at);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
.pill.f{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-weight:700}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tg{border:1px solid var(--bd);background:var(--cd);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.rw{display:flex;gap:8px;flex-wrap:wrap}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:#1F3D2C;color:#C8FF2E;display:grid;place-items:center;font-weight:700}
.big{width:72px;height:72px;font-size:24px;margin:0 auto 6px}
.hero{background:var(--ac);color:#0B0F0C;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .lab{font-size:12px;font-weight:700;letter-spacing:1px}
.hero .dk{background:#0B0F0C;color:#C8FF2E}
.hero .ol{border-color:#0B0F0C;color:#0B0F0C}
.in{display:block;width:100%;min-height:44px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);padding:0 12px;font:inherit}
label{display:block;margin:12px 0 4px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--cd)}
.n{flex:1;min-height:60px;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700}
.n.on{color:var(--at)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sh:empty{display:none}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:5}
.sh{width:100%;max-height:88%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:28px 20px 24px;position:relative}
.x{position:absolute;top:10px;right:10px}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:9;max-width:90%}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes bn{0%{transform:translateY(-34px) rotate(0);animation-timing-function:cubic-bezier(.55,0,1,.45)}50%{transform:translateY(0) rotate(180deg);animation-timing-function:cubic-bezier(0,.55,.45,1)}100%{transform:translateY(-34px) rotate(360deg)}}
@keyframes sh{0%,100%{transform:scale(.5);opacity:.15}50%{transform:scale(1);opacity:.35}}
@keyframes rg{from{transform:scale(.3);opacity:.35}to{transform:scale(1.5);opacity:0}}
@keyframes pl{0%{box-shadow:0 0 0 0 var(--at)}70%,100%{box-shadow:0 0 0 9px transparent}}
@keyframes su{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
@keyframes ti{from{opacity:0;transform:translate(-50%,14px)}}
@keyframes pop{40%{transform:translateY(-4px) scale(1.25)}}
@keyframes st{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.35) rotate(10deg)}100%{transform:none}}
@keyframes sw{from{opacity:0;transform:scale(.96)}}
@keyframes inL{from{opacity:0;transform:translateX(-44px)}}
@keyframes inR{from{opacity:0;transform:translateX(44px)}}
@keyframes zin{from{opacity:0;transform:scale(.2)}}
@keyframes spo{to{opacity:0;visibility:hidden}}
@keyframes rl{from{transform:translateX(-150px) rotate(-540deg);opacity:0}}
main.go>*{animation:up .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
main.go .vs>:first-child{animation:inL .6s .1s cubic-bezier(.2,.8,.2,1) backwards}
main.go .vs>:last-child{animation:inR .6s .1s cubic-bezier(.2,.8,.2,1) backwards}
main.go .vs>span{animation:zin .5s .45s cubic-bezier(.3,1.5,.5,1) backwards}
nav.go .n.on svg{animation:pop .45s .1s backwards}
.hero{position:relative;overflow:hidden}
.fx{position:absolute;right:12px;top:8px;width:80px;height:104px;pointer-events:none}
.fx svg{position:absolute;left:14px;top:46px;animation:bn 1.4s infinite}
.sd{position:absolute;left:20px;top:98px;width:40px;height:6px;border-radius:50%;background:#0B0F0C;animation:sh 1.4s infinite}
.ring{position:absolute;left:0;top:28px;width:80px;height:80px;border:2px solid #0B0F0C;border-radius:50%;opacity:0;animation:rg 3s ease-out infinite}
.r2{animation-delay:1.5s}
.live::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--at);margin-right:10px;animation:pl 1.6s infinite}
.pp svg{animation:st .5s}
.swap{animation:sw .4s cubic-bezier(.2,.8,.2,1)}
#sh.new .ov{animation:fd .25s both}
#sh.new .sh{animation:su .4s cubic-bezier(.2,.8,.2,1) both}
#ts{animation:ti .35s cubic-bezier(.2,.8,.2,1)}
.b,.chip,.ib,.n{transition:transform .15s,background-color .2s}
.b:active,.chip:active,.ib:active{transform:scale(.94)}
#sp{position:fixed;inset:0;z-index:20;background:#0B0F0C;color:#F4F7F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:spo .5s 1.5s both}
#sp .d{font-size:28px;animation:up .6s .5s backwards}
#sp .d span{color:#C8FF2E}
#sp .rb{animation:rl 1s cubic-bezier(.2,.7,.3,1) backwards}
#sp svg{width:72px;height:72px;color:#0B0F0C}
@media(max-width:360px){.fx{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}.fx,#sp{display:none}}
:root{--er:#B3261E}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--er:#FF8A80}}
:root[data-theme=dark]{--er:#FF8A80}
.dm{background:var(--cd);border:1px dashed var(--at);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mu)}
.dm b{color:var(--at)}
.pill.er{border-color:var(--er);color:var(--er)}
.sp{display:flex;justify-content:space-between}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;animation:gw .8s cubic-bezier(.2,.8,.2,1)}
@keyframes gw{from{width:0}}
.pg{display:flex;gap:6px}.pg i{flex:1;height:6px;border-radius:99px;background:var(--bd)}.pg i.on{background:var(--ac)}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc{min-height:84px;border-radius:16px;background:var(--cd);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.pc b{font-family:Unbounded,system-ui,sans-serif;font-size:16px}.pc span{font-size:11px;color:var(--mu)}
.pc.on{background:var(--ac);border-color:var(--ac);color:var(--on)}.pc.on span{color:var(--on)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:52px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);font-weight:700;padding:8px 12px;text-align:left}
button.av{cursor:pointer;border:0}.av.sel{outline:3px solid var(--at);outline-offset:2px}
.lk{background:none;border:0;padding:0;color:var(--at);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer;min-height:24px}
.wl{position:relative;overflow:hidden;margin:-16px -20px -24px;min-height:calc(100% + 40px);padding:24px 20px;display:flex;flex-direction:column;justify-content:flex-end;background:repeating-linear-gradient(#0E1A12 0 56px,#112017 56px 112px);color:#F4F7F2}
.wl .ring{left:50%;top:18%;margin-left:-110px;width:220px;height:220px;border-color:#C8FF2E}
.wl .bl{position:absolute;left:50%;top:calc(18% + 82px);margin-left:-26px;color:#0B0F0C;animation:bn 1.4s infinite}
.wl .lk{color:#C8FF2E}
</style>
</head>
<body>
<div id="app"><main></main><nav aria-label="Main"></nav><div id="sh"></div></div>
<div id="ts" role="status" aria-live="polite" hidden></div>
<div id="sp" aria-hidden="true"></div>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=n=>(n>12?n-12:n)+(n<12?' AM':' PM');
const T=[{id:'t1',n:'Turf One Arena',d:1.2,in:1,s:[19,20,21],p:2400},{id:'t2',n:'Goal Box Indoor',d:2.8,in:1,s:[18,20],p:2000},{id:'t3',n:'Kickoff Dome',d:3.5,in:1,s:[20,21,22],p:2800},{id:'t4',n:'Green Park Outdoor',d:0.9,in:0,s:[18,19,20,21],p:1600}];
const P=[{id:'p1',n:'Aarav K.',pos:'Midfielder',foot:'Right foot',lv:'Competitive',pl:'Weekday evenings',tm:'Night Owls FC',pf:['t1','t2']},
{id:'p2',n:'Meera J.',pos:'Goalkeeper',foot:'Left foot',lv:'Casual',pl:'Weekends',tm:'Night Owls FC',pf:['t1']},
{id:'p3',n:'Dev P.',pos:'Striker',foot:'Right foot',lv:'Competitive',pl:'Weekends',tm:'No team yet',pf:['t2','t3']},
{id:'p4',n:'Sana R.',pos:'Defender',foot:'Right foot',lv:'Casual',pl:'Weekday evenings',tm:'Blue Street United',pf:['t1']},
{id:'p5',n:'Kabir T.',pos:'Winger',foot:'Left foot',lv:'Competitive',pl:'Late nights',tm:'Red Line FC',pf:['t3']}];
const C=[{id:'c1',n:'Blue Street United',col:'#2A3A5C',pf:['t1','t2']},{id:'c2',n:'Red Line FC',col:'#6B2230',pf:['t3']},{id:'c3',n:'Street Kings FC',col:'#4A3A12',pf:['t2']}];
const POS=['Goalkeeper','Defender','Midfielder','Winger','Striker'];
const S={ob:{step:'welcome',cc:'+91',ph:'',acct:'',lg:0,n:'',av:0,age:'',lang:'English',pos:[],prim:'',flex:1,foot:'',lvl:'',fmt:[],int:'',frq:'',area:'',rad:5,days:[],slots:[],bud:'',look:'Both',done:0},tab:'play',gj:{},fl:{f:'',sk:'',d:'',c:''},or:{fmt:'5v5',win:[],dist:'5',sk:'',it:'',bud:'',bk:'No'},op:0,view:null,sh:null,top:1,mm:{o:null,h:20},pr:{n:1,h:20},
me:{n:'Riya S.',pos:'Midfielder',lv:'Competitive'},fr:['p1','p2'],tm:['p1','p2'],pf:['t1'],mt:[],
rq:[{id:'r1',t:'Street Kings FC',n:2,h:20,u:'t1'},{id:'r2',t:'Midnight Strikers',n:1,h:20,u:'t2'}]};
const K=['me','fr','tm','pf','mt','rq','ob','gj','or','op'];
try{const o=JSON.parse(localStorage.getItem('tb'));if(o)K.forEach(k=>o[k]&&(S[k]=o[k]))}catch(x){}
const save=()=>{try{localStorage.setItem('tb',JSON.stringify(Object.fromEntries(K.map(k=>[k,S[k]]))))}catch(x){}};
const I={play:'<path d="M4 11l8-7 8 7v9H4z"/>',teams:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-1.5-5-4-5.7"/>',turfs:'<path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',back:'<path d="M15 5l-7 7 7 7"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
const ic=(p,s=22,f)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"${f?' style="fill:currentColor"':''}>${p}</svg>`;
const tn=id=>T.find(t=>t.id==id),pl=id=>P.find(p=>p.id==id),byd=(a,b)=>a.d-b.d;
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(n,c,b)=>`<div class="av${b?' big':''}"${c?` style="background:${c};color:#fff"`:''}>${e(ini(n))}</div>`;
const tg=x=>`<span class="tg">${e(x)}</span>`;
const pfs=a=>a.map(x=>tg(tn(x).n)).join('');
const hrs=(k,cur)=>`<div class="rw">${[18,19,20,21,22].map(h=>`<button class="chip${h==cur?' on':''}" data-a="${k}" data-v="${h}" aria-pressed="${h==cur}">${H(h)}</button>`).join('')}</div>`;
const back=t=>`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><button class="ib" data-a="back" aria-label="Back">${ic(I.back,20)}</button><h1 class="d" style="font-size:18px">${t}</h1></div>`;
const rw=(p,x,s)=>`<div class="cd">${av(p.n)}<div style="flex:1"><b>${e(p.n)}</b><div class="mu">${s||p.pos+' · '+p.lv}</div></div>${x||''}</div>`;
const view=id=>`<button class="b ol" data-a="pf" data-v="${id}">View</button>`;

// Turf logic: shared preferred turf that is open, else nearest open indoor turf
function pick(c,h){const ok=t=>t.s.includes(h);
const sh=T.filter(t=>S.pf.includes(t.id)&&c.pf.includes(t.id)&&ok(t)).sort(byd)[0];
if(sh)return{t:sh,w:'SHARED PICK',x:'Both teams listed this turf.'};
const n=T.filter(t=>t.in&&ok(t)).sort(byd)[0];
return n&&{t:n,w:'NEAREST OPEN INDOOR TURF',x:'No shared turf is open at this time, so we picked the closest indoor one.'}}

function play(){const o=4-S.tm.length;
const rq=feed().map(r=>{const t=tn(r.u);return `<div class="cd"><div style="flex:1"><span class="pill">NEED ${r.n}</span><div style="font-weight:700;margin-top:6px">${e(r.t)}</div><div class="mu">${H(r.h)} · ${t.n} · ${t.d} km</div></div>${r.me?'<span class="mu">Your post</span>':r.j?'<span class="mu">Joined</span>':`<button class="b" data-a="join" data-v="${r.id}">Join</button>`}</div>`}).join('');
const mt=S.mt.map((m,i)=>`<div class="cd"><div style="flex:1"><div style="font-weight:700">${m.k=='v'?'Night Owls FC vs '+e(m.w):'Playing with '+e(m.w)}</div><div class="mu">${H(m.h)} · ${tn(m.u).n}</div></div><button class="b ol" data-a="hub" data-v="${i}">Open</button></div>`).join('');
return `<h1 class="d" style="font-size:26px;line-height:1.15;margin:4px 0 0">Hey ${e(S.me.n.split(' ')[0])}, who’s playing today?</h1>
<div class="hero"><div class="fx" aria-hidden="true"><i class="ring"></i><i class="ring r2"></i>${BALL}<i class="sd"></i></div><div class="lab">YOUR TEAM · 5-A-SIDE</div><div class="d" style="font-size:22px">Night Owls FC</div><div>${o?o+' spot'+(o>1?'s':'')+' open':'Squad full'}</div><div class="rw"><button class="b dk" data-a="match">Find an opponent</button>${o?'<button class="b ol" data-a="post">Need players</button>':''}</div></div>
${homeX()}${mt?'<h2>Your matches</h2>'+mt:''}<h2 class="live" id="fd">Need a player now</h2>${rq||'<div class="cd mu">No open games inside your radius yet. Widen it in your profile.</div>'}`}

function teams(){const o=4-S.tm.length;
const sq=rw({n:S.me.n,pos:S.me.pos,lv:S.me.lv},'<span class="mu">You</span>')+S.tm.map(i=>rw(pl(i),view(i))).join('');
const op=o>0?`<div class="cd dash"><div style="flex:1"><b>${o} open spot${o>1?'s':''}</b><div class="mu">Add a friend to your squad</div></div><button class="b" data-a="am">Add</button></div>`:'';
return `<h1 class="d" style="font-size:22px;margin:4px 0">Night Owls FC</h1><div class="mu">Your squad · ${5-o} of 5</div><h2>Squad</h2>${sq}${op}
<h2>Teams near you</h2>${C.map(c=>`<div class="cd">${av(c.n,c.col)}<div style="flex:1"><b>${c.n}</b><div class="rw" style="margin-top:6px">${pfs(c.pf)}</div></div><button class="b ol" data-a="opp" data-v="${c.id}">Challenge</button></div>`).join('')}
<h2>Players</h2>${P.map(p=>rw(p,view(p.id),p.pos+' · '+p.tm)).join('')}`}

function turfs(){return `<h1 class="d" style="font-size:22px;margin:4px 0">Nearby turfs</h1><div class="mu">Star your favourites. Challenges try your team’s picks first.</div><h2></h2>`+[...T].sort(byd).map(t=>{const f=S.pf.includes(t.id);return `<div class="cd" style="align-items:flex-start"><div style="flex:1"><b>${t.n}</b><div class="mu">${t.d} km · ${t.in?'Indoor':'Outdoor'}</div><div class="rw" style="margin-top:8px">${t.s.map(h=>tg(H(h))).join('')}</div></div><button class="ib${S.pp==t.id&&f?' pp':''}" data-a="star" data-v="${t.id}" aria-pressed="${f}" aria-label="${f?'Remove from':'Add to'} preferred turfs" style="${f?'color:var(--at)':''}">${ic(I.star,20,f)}</button></div>`}).join('')}

function me(){const m=S.me,o=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
return `<div style="display:grid;place-items:center;gap:4px;margin:4px 0 8px">${av(m.n,0,1)}<h1 class="d" style="font-size:22px">${e(m.n)}</h1><div class="mu">${m.pos} · ${m.lv}</div></div>
<h2>Your details</h2>
<label class="mu" for="f1">Name</label><input id="f1" class="in" data-f="n" value="${e(m.n)}" maxlength="20">
<label class="mu" for="f2">Position</label><select id="f2" class="in" data-f="pos">${o(POS,m.pos)}</select>
<label class="mu" for="f3">Level</label><select id="f3" class="in" data-f="lv">${o(['Casual','Competitive'],m.lv)}</select>
<h2>Preferred turfs</h2><div class="rw">${S.pf.length?pfs(S.pf):'<span class="mu">None yet. Star turfs in the Turfs tab.</span>'}</div>
<p class="mu" style="margin-top:20px">Your name, photo, team and preferred turfs are visible to every player on Turfbooked.</p><h2>Account</h2><div class='rw'><button class='b ol' data-a='ed' data-v='s7'>Edit football profile</button><button class='b ol' data-a='so'>Sign out</button><button class='b ol' data-a='del'>Delete saved data</button></div><p class='mu'>Demo: signing out keeps your profile in this browser, deleting clears it. Real accounts, recovery and deletion need a server.</p>`}

function match(){const m=S.mm;
if(!m.o)return back('Find an opponent')+'<div class="mu" style="margin-bottom:12px">Pick a team to challenge.</div>'+C.map(c=>`<div class="cd">${av(c.n,c.col)}<div style="flex:1"><b>${c.n}</b><div class="rw" style="margin-top:6px">${pfs(c.pf)}</div></div><button class="b" data-a="opp" data-v="${c.id}">Choose</button></div>`).join('');
const c=C.find(x=>x.id==m.o),r=pick(c,m.h);
return back('Match setup')+`<div class="vs" style="display:flex;align-items:flex-start;justify-content:space-around;margin:8px 0 20px;text-align:center"><div>${av('Night Owls FC','#1F3D2C',1)}<b>Night Owls FC</b></div><span class="d mu" style="margin-top:24px">VS</span><div>${av(c.n,c.col,1)}<b>${c.n}</b></div></div>
<div class="mu">Pick a time</div><div style="margin:8px 0 16px">${hrs('hr',m.h)}</div>
